<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="616x474" href="/logo-favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/logo-favicon.png" />
    <link rel="apple-touch-icon" href="/logo-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;700;800;900&family=Cairo:wght@400;500;700;900&display=swap" rel="stylesheet">
    <title>Captive Events</title>
    <style>
      /* Hide Google Translate top banner */
      .goog-te-banner-frame, 
      iframe.goog-te-banner-frame,
      .goog-te-banner,
      iframe.skiptranslate {
        display: none !important;
        visibility: hidden !important;
      }
      body {
        top: 0px !important;
      }
      .goog-tooltip,
      .goog-tooltip:hover,
      .goog-te-balloon-frame {
        display: none !important;
        visibility: hidden !important;
      }
      .goog-text-highlight {
        background-color: transparent !important;
        box-shadow: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="google_translate_element" style="display:none"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,ar',
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
